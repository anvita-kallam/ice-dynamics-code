# Held-out velocity validation — MISMIP A=20 more_sliding sequential Stage 2.
# Reuses the existing frozen sequential PINN; does NOT retrain it.
# Velocity obs: 80% train / 20% holdout (seed=42). Geometry unchanged.
#
#   cd Archive
#   python train_vi_only_torch.py configs/heldout_velocity_validation/run_torch_vi_only_a20_holdout.cfg
#
# Dataset is prepared by scripts/prepare_velocity_holdout_dataset.py
# (or scripts/run_heldout_velocity_validation.py).

[runtime]
dtype = 'float64'

[data]
h5file = '../outputs/heldout_velocity_validation/dataset/grid_velocity_holdout_f0.2_s42.npz'
default_u_err = 3.0
default_v_err = 3.0
default_s_err = 5.0
default_b_err = 5.0
s2y = 3600*24*365.25
# Holdout controls (read by prepare/eval scripts; ignored by train_vi_only_torch).
velocity_holdout_fraction = 0.2
velocity_holdout_seed = 42
velocity_holdout_source = '../outputs/spinup/production/more_sliding/SteadyState_more_sliding_10500yr_ramp4000_1refine_grid.npz'
velocity_holdout_mask = '../outputs/heldout_velocity_validation/dataset/holdout_mask_f0.2_s42.npz'

[prior]
eta_init = 15.0
# Pa·yr → MPa·yr: original (1e3, 1e10) / 1e6
eta_min = 1.0e3 / 1.0e6
eta_max = 1.0e10 / 1.0e6
l_scale_eta = 10.0e3
std_eta = 2.0
l_scale_lambda = 10.0e3
std_lambda = 1.0
lambda_init = 0.5
kl_eta = 0.15
kl_lambda = 0.0
kernel_type = 'matern32'
anisotropic = False
learnable_length_scale = True
num_inducing_x = 28
num_inducing_y = 28
inducing_placement = 'ice_fps'
thickness_min = 1.0
speed_epsilon = 1.0
year = 3600*24*365.25
glen_exponent = 3.0
weertman_exponent = 3.0
strain_rate_min = 1.0e-5
fluidity_A = 3.985e-13 * 3600*24*365.25 * 1.0e18
friction_C = 0.001
ssa_enforce_continuity = False
ssa_use_inferred_eta = True

[likelihood]
rx_std = 5.0
ry_std = 5.0
rH_std = 5.0
ssa_rx_std = 0.06
ssa_ry_std = 0.06
ssa_rh_std = 0.06
trainable_obs_variance = False

[train]
physics_approximation = 'SSA'
lr = 0.0002
vgp_eta_lr = 3.0e-4
vgp_lambda_lr = 1.0e-5
eta_shift_lr = 3.0e-4
vgp_optimizer = 'adamw'
vgp_ngd_lr = 1.0e-2
restore = False
restore_optimizer = False
n_epochs = 300
batch_size = 2048
physics_batch_size = 512
data_scale = 1.0
phys_scale = 4.0
state_reg_scale = 0.0
eta_prior_scale = 0.08
eta_prior_std = 1.5
lr_scheduler = 'cosine'
lr_scheduler_eta_min = 1.0e-5
lr_scheduler_factor = 0.5
lr_scheduler_patience = 40
lr_scheduler_gamma = 0.995
grad_eta_warn_ratio = 100.0
vgp_grad_clip = 5.0
early_stop_metric = 'log10_eta_r'
early_stop_patience = 20
early_stop_min_delta = 1.0e-4
meannet_checkdir = 'checkpoints/torch_pretrain/more_sliding_sequential'
meannet_checkname = 'model_best'
checkdir = 'checkpoints/torch_vi_only/heldout_velocity_validation/a20_more_sliding'
logfile = 'logs/log_vi_only_heldout_velocity_a20'
plot_every = 25
quadrature_size = 2
test_every = 5
eta_eval_every = 5
checkname_old = 'model'
checkname_new = 'model'
checkname_best = 'model_best'
require_pretrain_checkpoint = True
verify_pretrain_load = True
evaldir = '../outputs/heldout_velocity_validation'
seed = 42

[pretrain]
lr = 0.0002
restore = False
n_epochs = 1000
batch_size = 2048
checkdir = 'checkpoints/torch_pretrain/more_sliding_sequential'
logfile = 'logs/log_pretrain_torch_more_sliding_sequential'
resnet = True
optimizer = 'adam'
test_every = 1
checkname = 'model'

[predict]
batch_size = 8192
num_samples = 200
output_file = '../outputs/heldout_velocity_validation/posterior_samples.h5'

[torch]
backend = 'gloo'
device = 'auto'
num_workers = 0
pin_memory = False
train_drop_last = True
threads = 32
